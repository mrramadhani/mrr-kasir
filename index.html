<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRR Kasir</title>
<style>
*{box-sizing:border-box}
:root{--bg:#FAF7F3;--card:#fff;--ink:#231C30;--mute:#6C6478;--line:#EBE5F1;--pri:#3A2F63;--onpri:#fff;--acc:#D97D4A;--okbg:#E3F0EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131f;--card:#221c30;--ink:#f1edf7;--mute:#a69fb3;--line:#352d47;--pri:#8d7fd1;--onpri:#17131f;--acc:#e8935f;--okbg:#1e3a33}}
:root[data-theme="dark"]{--bg:#17131f;--card:#221c30;--ink:#f1edf7;--mute:#a69fb3;--line:#352d47;--pri:#8d7fd1;--onpri:#17131f;--acc:#e8935f;--okbg:#1e3a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--pri);color:var(--onpri)}
header small{opacity:.8}
main{display:grid;grid-template-columns:1fr 350px;gap:12px;padding:12px;align-items:start}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
input,select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;width:100%}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;border-radius:99px;padding:6px 12px}
.tab.on,.seg .on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
#q{margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tile{text-align:left;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-weight:600}
.tile small{font-weight:400;color:var(--mute)}
.tile.new{border-style:dashed;color:var(--acc)}
.tile.pp{background:var(--okbg)}
.tile:active{transform:scale(.97)}
.cart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px))}
.cart h2{margin:0 0 6px;font-size:15px}
.ln{border-bottom:1px solid var(--line);padding:8px 0}
.r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.s{font-size:12px;color:var(--mute)}
.ctl{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.ctl button{padding:4px 10px}
.ctl .q{width:58px;text-align:center}
.ctl select{width:auto}
.ctl .lb{width:90px}
.tot{font-size:18px;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1}
.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
.pri:disabled{opacity:.4;cursor:not-allowed}
.ghost{width:100%;margin-top:8px;border-style:dashed}
.empty{color:var(--mute);text-align:center;padding:14px 0}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--card);border-radius:14px;padding:16px;width:min(420px,100%);max-height:90vh;overflow:auto}
.box h3{margin:0 0 8px}
.box label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mute)}
.big{font-size:28px;font-weight:700;margin:4px 0 10px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.quick button{padding:5px 9px}
pre{background:#fff;color:#111;border-radius:8px;padding:10px;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:92vw;text-align:center}
#toast.show{opacity:1}
[hidden]{display:none!important}
header nav{display:flex;gap:6px}
header nav button{background:transparent;color:var(--onpri);border-color:rgba(255,255,255,.45);padding:4px 12px;border-radius:8px}
header nav button.on{background:var(--onpri);color:var(--pri)}
.hw{max-width:720px;margin:0 auto;padding:12px}
.hn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.hn.vd{opacity:.55}
.gh{grid-column:1/-1;font-size:12px;color:var(--mute);margin-top:6px}
.hw.wide{max-width:900px}
.lp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.lp button{padding:6px 14px;border-radius:99px}
.lp button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.lp input[type=date],.lp select{width:auto}
.chart{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:6px 0}
.bc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:34px}
.bs{height:140px;width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;background:var(--chip)}
.bc span{font-size:10px;color:var(--mute)}
.bs i{display:block;width:100%}
.lg2{font-size:12px;color:var(--mute);margin-bottom:6px}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.s-Jasa{background:var(--pri)}.s-Barang{background:var(--acc)}.s-PPOB{background:#3E8574}.s-Tip{background:#9a8fb0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td small{display:block;color:var(--mute);font-size:11px}
#pp{display:none}
@media print{body>*:not(#pp){display:none!important}body{background:#fff!important;color:#000}#pp{display:block;font:11px/1.25 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:0}@page{size:58mm auto;margin:2mm}}
.chart{display:block;overflow-x:auto;padding:6px 0}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font-size:10px}
.ax.td{fill:var(--pri);font-weight:700}
.av{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 3}
.av2{fill:var(--acc)}
.sv-Jasa{fill:var(--pri)}.sv-Barang{fill:var(--acc)}.sv-PPOB{fill:#3E8574}.sv-Tip{fill:#9a8fb0}
.stk{transform-box:fill-box;transform-origin:bottom;animation:rise .5s ease}
@keyframes rise{from{transform:scaleY(0)}}
.bar{cursor:pointer}
.bar:hover .stk,.bar.on .stk{filter:brightness(1.12)}
.bar.on rect[fill=transparent]{fill:color-mix(in srgb,var(--pri) 8%,transparent)}
.lti{min-height:20px;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.chart{overflow:visible}
.cw{display:flex;align-items:flex-start}
.cax{flex:none}
.cs{overflow-x:auto;flex:1;min-width:0}
:root{--chip:#EAE5F1;--sh:0 1px 2px rgba(35,28,48,.06),0 4px 14px rgba(35,28,48,.06);--rad:14px}
:root[data-theme="dark"]{--chip:#2c2540;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25)}
:root[data-pal="teal"][data-theme="light"]{--pri:#2F6B5E;--acc:#D97D4A}
:root[data-pal="teal"][data-theme="dark"]{--pri:#6fc2ad;--onpri:#10201c;--acc:#e8935f}
:root[data-pal="terra"][data-theme="light"]{--pri:#B5562B;--acc:#3E8574}
:root[data-pal="terra"][data-theme="dark"]{--pri:#e8935f;--onpri:#2a140a;--acc:#6fc2ad}
body{font-feature-settings:"tnum"}
header{box-shadow:0 2px 12px rgba(0,0,0,.18);gap:10px;flex-wrap:wrap}
.hb{display:flex;align-items:center;gap:8px}
.lg{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--onpri);color:var(--pri);font-weight:800}
.sw{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid var(--onpri);opacity:.65}
.sw.on{opacity:1;box-shadow:0 0 0 2px var(--pri),0 0 0 4px var(--onpri)}
.md{padding:3px 9px;border-radius:8px;background:transparent;color:var(--onpri);border-color:rgba(255,255,255,.45)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--sh)}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:16px}
#tabs .tab{flex:1;padding:8px 14px;font-weight:600}
.tile{padding:10px;border-radius:var(--rad);box-shadow:var(--sh);gap:8px;min-height:88px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}
.bd{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--pri);font:700 11px system-ui;font-style:normal}
.tile.pp .bd{background:var(--okbg);color:var(--ink)}
.tile.new .bd{background:transparent;border:1px dashed var(--acc);color:var(--acc)}
.cart{border-radius:16px;box-shadow:var(--sh)}
.cn{background:var(--acc);color:#fff;border-radius:99px;padding:0 8px;font-size:12px}
.cn:empty{display:none}
.ei{font-size:30px}
.pri:not(:disabled):hover{filter:brightness(1.1)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus,select:focus{border-color:var(--pri)}
.mb{backdrop-filter:blur(3px)}
.box{border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .15s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:radial-gradient(900px 420px at 90% -5%,color-mix(in srgb,var(--pri) 14%,transparent),transparent 70%),radial-gradient(700px 400px at -5% 45%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.sc{display:flex;flex-direction:column;margin:2px 0 10px}
.sc b{font-size:16px}
.sc span{color:var(--mute);font-size:12px}
#grid.few{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
#grid.few .tile{min-height:104px;font-size:15px}
#grid.few .bd{width:36px;height:36px;font-size:12px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;box-shadow:var(--sh)}
.ic h4{margin:0 0 8px;font-size:13px}
.ic .rw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 18px}
.ic .rw div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dashed var(--line);padding:4px 0}
.ic .s{margin-top:8px}
:root[data-pal="ocean"][data-theme="light"]{--pri:#1F5FA8;--acc:#E08A2E}
:root[data-pal="ocean"][data-theme="dark"]{--pri:#7fb2ee;--onpri:#0e1b2c;--acc:#f0a65a}
:root[data-pal="rose"][data-theme="light"]{--pri:#A5345C;--acc:#3E8574}
:root[data-pal="rose"][data-theme="dark"]{--pri:#ee86a9;--onpri:#2a0e18;--acc:#6fc2ad}
:root[data-pal="slate"][data-theme="light"]{--pri:#3B4A5A;--acc:#D97D4A}
:root[data-pal="slate"][data-theme="dark"]{--pri:#a3b3c4;--onpri:#12181f;--acc:#e8935f}
.ln.fl{animation:fl .6s ease}
@keyframes fl{0%{background:color-mix(in srgb,var(--acc) 30%,transparent)}100%{background:transparent}}
#toast.act{pointer-events:auto}
.ub{margin-left:8px;padding:2px 10px;border-radius:8px;background:var(--bg);color:var(--ink);font-weight:600}
.st{font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.cm{display:none;float:right;padding:0 10px}
.stat b{font-size:clamp(13px,3.6vw,16px)}
.stat div{min-width:0}
main{max-width:1400px;margin:0 auto}
@media(max-width:800px){input,select{font-size:16px}.cm{display:inline-block}.cart.min #lines{display:none}.cart{border-radius:16px 16px 0 0}}
@media(pointer:coarse){.ctl button{padding:8px 14px}.tab{padding:10px 14px}.sw{width:22px;height:22px}}
.hn.vd .r b:last-child{text-decoration:line-through}
@media(max-width:600px){header small{display:none}}
@media(max-width:800px){main{grid-template-columns:1fr}.cart{position:sticky;top:auto;bottom:0;max-height:46vh;overflow:auto;box-shadow:0 -4px 16px rgba(0,0,0,.12)}}
</style>

<body>
<header><div class="hb"><span class="lg">M</span><div><b>MRR Fotokopi, Print &amp; ATK</b> <span id="st" class="st">● Mode uji</span></div></div><div class="hb"><nav><button class="on" data-a="view" data-v="kasir">Kasir</button><button data-a="view" data-v="riwayat">Riwayat</button><button data-a="view" data-v="laporan">Laporan</button></nav><span class="hb"><button class="sw" data-a="pal" data-v="plum" style="background:#3A2F63" title="Plum"></button><button class="sw" data-a="pal" data-v="teal" style="background:#3E8574" title="Teal"></button><button class="sw" data-a="pal" data-v="terra" style="background:#D97D4A" title="Terakota"></button><button class="sw" data-a="pal" data-v="ocean" style="background:#1F5FA8" title="Biru"></button><button class="sw" data-a="pal" data-v="rose" style="background:#A5345C" title="Mawar"></button><button class="sw" data-a="pal" data-v="slate" style="background:#3B4A5A" title="Grafit"></button></span><button class="md" id="ey" data-a="eye" title="Tampilkan/sembunyikan untung">🙈</button><button class="md" id="md" data-a="mode" title="Ganti terang/gelap">☾</button></div></header>
<main>
  <section>
    <div id="stat" class="stat" title="Ringkasan hari ini"></div>
    <div id="tabs"></div>
    <input id="q" placeholder="Cari barang atau layanan...">
    <div id="sec"></div><div id="grid"></div><div id="info"></div>
  </section>
  <aside class="cart">
    <h2>Keranjang <span id="cn" class="cn"></span><button class="cm" data-a="cmin" title="Ciutkan/bentangkan">▾</button></h2>
    <div id="lines"></div>
    <div id="sum"></div>
    <div class="btns">
      <button data-a="clear" id="bc">Kosongkan</button>
      <button data-a="struk">Struk</button>
      <button data-a="pay" class="pri">Bayar</button>
    </div>
  </aside>
</main>
<section id="hv" hidden><div class="hw"><h2>Riwayat</h2><select id="hd" style="width:auto;margin:0 8px 8px 0"><option value="1">24 jam</option><option value="7" selected>7 hari</option><option value="30">30 hari</option><option value="all">Semua</option></select><input id="hs" placeholder="Cari nama item..." style="width:min(280px,100%)"><div id="hl"></div></div></section>
<pre id="pp"></pre>
<section id="lv" hidden><div class="hw wide">
<h2>Laporan</h2>
<div class="lp"><button data-a="lp" data-v="1">Hari ini</button><button class="on" data-a="lp" data-v="7">7 hari</button><button data-a="lp" data-v="M">Bulan ini</button><button data-a="lp" data-v="A">Semua</button><button data-a="lrefresh" title="Muat ulang">&#8635;</button></div>
<div class="lp"><label class="s">Dari <input id="lf" type="date"></label><label class="s">Sampai <input id="lt" type="date"></label></div>
<div id="lc" class="stat"></div>
<p class="s">Untung tampil setelah ikon mata di header dibuka.</p>
<div class="ic"><h4>Omzet harian</h4><div class="lg2"><i class="s-Jasa"></i>Jasa<i class="s-Barang"></i>Barang<i class="s-PPOB"></i>PPOB<i class="s-Tip"></i>Tip<span id="lav" style="float:right"></span></div><div id="lch" class="chart"></div><div id="lti" class="s lti">Ketuk atau arahkan ke batang untuk melihat rincian.</div></div>
<div class="ic"><h4>Barang terjual per item</h4><div class="lp"><select id="lk"></select><select id="ls"><option value="qty">Terbanyak terjual</option><option value="om">Omzet tertinggi</option><option value="un">Untung tertinggi</option></select></div><div id="ltb"></div></div>
</div></section>
<div id="modal"></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const API='https://script.google.com/macros/s/AKfycbz2-AEEJVQpslfr6-SETOfMyDoX2p5-nm5qZJpSK84f3fMkF0p-ddzbhUoWDg9Rdgf0/exec';
const fmt=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const num=n=>Math.round(n).toLocaleString('id-ID');
let RND=500;const R500=n=>Math.ceil(n/RND)*RND;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KER={A4:76,F4:86,TANPA:0};
let KJ=100; // potongan per lembar kalau pelanggan bawa kertas sendiri (= harga jual kertas A4)
// nama, cara, sisi/lembar, harga flat, toner per sisi
const SVC={fk:['Fotokopi (Tier)','tier',1,0,12],fs:['Fotokopi Satuan','flat',1,500,12],bt:['Bolak-balik (Tier)','tier',2,0,12],bs:['Bolak-balik Satuan','flat',2,1000,12],pb:['Print Hitam Putih','flat',1,500,12],pw:['Print Warna Penuh','flat',1,2000,48],ph:['Print Warna Setengah','flat',1,1500,48],ps:['Print Warna Sedikit','flat',1,1000,48]};
const SHORT={fk:'Fotokopi',fs:'Fotokopi',bt:'Fotokopi Bolak-balik',bs:'Fotokopi Bolak-balik',pb:'Print Hitam Putih',pw:'Print Warna Penuh',ph:'Print Warna Setengah',ps:'Print Warna Sedikit'};
let PPOB=[],PPOBID=[],TIER=[],P={};
// id, nama, kategori, harga jual, modal
let ITEMS=[];
const TABS=['Jasa','PPOB','ATK'];

let cart=[],active={},uid=0,tab='Jasa',pay={},hist=[],armed=false,tt,nid=0,view='kasir',SD=null,SM=false,fix=null,hq='',SU=false,prevQ={};
const tierP=s=>{const t=TIER.find(x=>s>=x.a&&s<=x.b)||TIER[TIER.length-1];return t.per?t.p*s:t.p;};

function calc(l){
  if(l.t=='row')return{jual:l.jual,modal:l.modal};
  if(l.t=='item')return{jual:l.p*l.q,modal:l.m*l.q};
  if(l.t=='ppob')return{jual:l.asli+l.admin,modal:l.m};
  const [,tp,sisi,flat,toner]=SVC[l.k];
  const j=(tp=='tier'?tierP(l.q*sisi):flat*l.q)-(l.kr=='TANPA'?KJ*l.q:0);
  return{jual:Math.max(0,j),modal:l.q*(KER[l.kr]+sisi*toner)};
}
function totals(){
  let jasa=0,other=0,modal=0;
  cart.forEach(l=>{const c=calc(l);modal+=c.modal;if(l.t=='svc')jasa+=c.jual;else other+=c.jual;});
  const round=R500(jasa)-jasa,total=R500(jasa)+other;
  return{round,total,untung:total-modal};
}
function addSvc(k,fresh){
  const tier=SVC[k][1]=='tier';let l=null;
  if(tier&&!fresh)l=cart.find(x=>x.id==active[k]);
  if(!tier)l=cart.find(x=>x.t=='svc'&&x.k==k);
  if(l)l.q++;
  else{l={id:++uid,t:'svc',k,q:1,kr:'A4',lb:''};cart.push(l);if(tier)active[k]=l.id;}
  render();
}
function addItem(i){
  const l=cart.find(x=>x.t=='item'&&x.i==i);
  if(l)l.q++;
  else{const d=ITEMS.find(x=>x[0]==i);cart.push({id:++uid,t:'item',i,n:d[1],p:d[3],m:d[4],q:1});}
  render();
}
function lineH(l){
  const c=calc(l);
  if(l.t=='ppob')return`<div class="ln"><div class="r"><b>${esc(l.n)}</b><span>${num(c.jual)}</span></div><div class="r s"><span>${num(l.asli)} + admin ${num(l.admin)} · ${l.pf}</span><span>untung ${U(c.jual-l.m)}</span></div>${l.cat?`<div class="s">${esc(l.cat)}</div>`:''}<div class="ctl"><button data-a="del" data-id="${l.id}">Hapus</button></div></div>`;
  if(l.t=='item')return`<div class="ln"><div class="r"><b>${esc(l.n)}</b><span>${num(c.jual)}</span></div><div class="ctl"><button data-a="dec" data-id="${l.id}">−</button><input class="q" type="number" min="1" value="${l.q}" data-a="q" data-id="${l.id}"><button data-a="inc" data-id="${l.id}">+</button><button data-a="del" data-id="${l.id}">Hapus</button></div></div>`;

function struk(){
  const W=Number(P['Lebar Struk'])||32,t=totals(),L=[],sep='-'.repeat(W),p=n=>String(n).padStart(2,'0');
  const ctr=s=>' '.repeat(Math.max(0,(W-s.length)>>1))+s;
  const wrap=s=>{const o=[];let c='';s.split(' ').forEach(w=>{const n=c?c+' '+w:w;if(n.length>W){o.push(c);c=w;}else c=n;});if(c)o.push(c);return o;};
  const row=(a,b)=>{b=String(b);a=a.slice(0,W-b.length-1);return a+' '.repeat(W-a.length-b.length)+b;};
  wrap(String(P['Nama Usaha']||'MRR Fotokopi')).forEach(s=>L.push(ctr(s)));
  wrap(String(P['Alamat']||'')).forEach(s=>L.push(ctr(s)));
  L.push(...(P['Nomor WA']?[ctr('WA '+P['Nomor WA'])]:[]),sep);
  const d=SD||new Date();if(SM)L.push(ctr('*** CETAK ULANG ***'));
  L.push(row(`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`,`${p(d.getHours())}:${p(d.getMinutes())}`),sep);
  const last=[...cart].reverse().find(l=>l.t=='svc');
  cart.forEach(l=>{
    const price=calc(l).jual+(l===last?t.round:0);
    const nm=l.t=='svc'?`${SHORT[l.k]} ${l.q} lembar`:l.t=='item'?(l.q>1?`${l.n} x${l.q}`:l.n):l.n;
    L.push(row(nm,num(price)));
    if(l.cat&&(l.t=='ppob'||l.t=='row'))L.push(' '+String(l.cat).slice(0,W-1));
  });
  L.push(sep,row('TOTAL',num(t.total)),sep,...wrap(String(P['Teks Penutup Struk']||'Terima kasih').replace(/\.+$/,'')).map(x=>ctr(x)));
  return L.join('\n');
}

  const f=$('lf').value,t=$('lt').value;
  if(f||t)return[f?new Date(f+'T00:00:00'):new Date(0),t?new Date(t+'T23:59:59'):END];
  if(LP=='1')return[d0,END];
  if(LP=='7')return[new Date(d0.getTime()-6*864e5),END];
  if(LP=='M')return[new Date(now.getFullYear(),now.getMonth(),1),END];
  return[new Date(0),END];
}
const grp=(id,j)=>j=='Tip'?'Tip':j=='Pembulatan'?'Jasa':String(id).indexOf('JSA')==0?'Jasa':String(id).indexOf('PPB')==0?'PPOB':'Barang';
function renderLap(){
  const [a,b]=lapRange(),G=['Jasa','Barang','PPOB','Tip'];
  const rows=LR.map(r=>({id:String(r[0]),at:new Date(r[1]),jenis:r[2],item:String(r[3]),nama:r[4],q:Number(r[6])||0,jual:Number(r[7])||0,untung:Number(r[9])||0,st:r[12]})).filter(r=>r.st!='Void'&&r.at>=a&&r.at<=b);
  const om=rows.reduce((x,r)=>x+r.jual,0),un=rows.reduce((x,r)=>x+r.untung,0),nn=new Set(rows.map(r=>r.id)).size;
  $('lc').innerHTML=`<div><span>Omzet</span><b>${fmt(om)}</b></div><div><span>Untung</span><b>${U(un)}</b></div><div><span>Nota</span><b>${nn}</b></div>`;
  const day={};
  rows.forEach(r=>{const k=r.at.toLocaleDateString('en-CA');(day[k]=day[k]||{Jasa:0,Barang:0,PPOB:0,Tip:0})[grp(r.item,r.jenis)]+=r.jual;});
  const keys=Object.keys(day).sort();let h='',avgTxt='';LDAY=day;
  if(keys.length){
    const list=[];
    for(const d=new Date(keys[0]+'T00:00:00'),e=new Date(keys[keys.length-1]+'T00:00:00');d<=e;d.setDate(d.getDate()+1))list.push(d.toLocaleDateString('en-CA'));
    const tot=k=>day[k]?G.reduce((x,g)=>x+day[k][g],0):0,mx0=Math.max(...list.map(tot),1);
    const p=Math.pow(10,Math.floor(Math.log10(mx0/4))),st=[1,2,2.5,5,10].map(m=>m*p).find(v=>v*4>=mx0),top=st*4;
    const AX=46,W0=Math.max(240,($('lch').clientWidth||320)-AX-8),slot=Math.max(22,Math.floor(W0/list.length)),W=slot*list.length+6,H=190,B=22,T=10,ph=H-B-T,bw=Math.min(slot-6,40);
    const yy=v=>T+ph-v/top*ph,fk=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0).replace('.',',')+' jt':v>=1000?Math.round(v/1000)+' rb':String(v);
    const avg=list.reduce((x,k)=>x+tot(k),0)/list.length,lab=Math.max(1,Math.ceil(36/slot)),today=new Date().toLocaleDateString('en-CA');
    let ax=`<svg class="cax" width="${AX}" height="${H}" aria-hidden="true">`,sv=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Omzet harian">`;
    for(let i=0;i<=4;i++){const y=yy(st*i);ax+=`<text x="${AX-6}" y="${y+3}" text-anchor="end" class="ax">${i?'Rp'+fk(st*i):'0'}</text>`;sv+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="gl"/>`;}
    list.forEach((k,i)=>{
      const x0=3+i*slot,x=x0+(slot-bw)/2,v=day[k]||{},t=tot(k),hh=t/top*ph;let y0=T+ph;
      sv+=`<g class="bar" data-k="${k}"><rect x="${x0}" y="${T}" width="${slot}" height="${ph+B}" fill="transparent"/>`;
      if(t){
        sv+=`<clipPath id="c${i}"><rect x="${x}" y="${T+ph-hh}" width="${bw}" height="${hh}" rx="4"/></clipPath><g clip-path="url(#c${i})" class="stk">`;
        G.forEach(g=>{if(v[g]){const sh=v[g]/top*ph;y0-=sh;sv+=`<rect x="${x}" y="${y0}" width="${bw}" height="${sh}" class="sv-${g}"/>`;}});
        sv+='</g>';
      }
      if(i%lab==0)sv+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" class="ax${k==today?' td':''}">${k.slice(8)}/${k.slice(5,7)}</text>`;
      sv+='</g>';
    });
    sv+=`<line x1="0" x2="${W}" y1="${yy(avg)}" y2="${yy(avg)}" class="av"/></svg>`;
    h=`<div class="cw">${ax}</svg><div class="cs">${sv}</div></div>`;
    avgTxt='garis putus-putus: rata-rata Rp'+fk(Math.round(avg))+' per hari';
  }
  $('lch').innerHTML=h||'<p class="empty">Belum ada transaksi pada periode ini.</p>';
  $('lav').textContent=avgTxt;
  const cs=$('lch').querySelector('.cs');if(cs)cs.scrollLeft=cs.scrollWidth;
  const it={};
  rows.filter(r=>r.jenis=='Item').forEach(r=>{const k=r.item||r.nama,o=it[k]=it[k]||{n:NAMA[r.item]||r.nama,kat:KAT[r.item]||'Lainnya',q:0,om:0,un:0};o.q+=r.q;o.om+=r.jual;o.un+=r.untung;});
  const LK=$('lk').value||'Semua',LS=$('ls').value||'qty';
  const kats=['Semua',...new Set(Object.values(it).map(o=>o.kat))];
  $('lk').innerHTML=kats.map(k=>`<option${k==LK?' selected':''}>${esc(k)}</option>`).join('');
  const L=Object.values(it).filter(o=>LK=='Semua'||o.kat==LK).sort((x,y)=>LS=='un'?y.un-x.un:LS=='om'?y.om-x.om:y.q-x.q);
  $('ltb').innerHTML=L.length?`<table><tr><th>Item</th><th>Terjual</th><th>Omzet</th><th>Untung</th></tr>${L.map(o=>`<tr><td>${esc(o.n)}<small>${esc(o.kat)}</small></td><td>${num(o.q)}</td><td>${num(o.om)}</td><td>${U(o.un)}</td></tr>`).join('')}</table>`:'<p class="empty">Tidak ada data.</p>';
}
document.addEventListener('change',e=>{if(['ls','lk','lf','lt'].includes(e.target.id))renderLap();});
let LDAY={};
const showBar=e=>{
  const g=e.target.closest&&e.target.closest('.bar');if(!g)return;
  const k=g.dataset.k,v=LDAY[k]||{},t=Object.values(v).reduce((x,y)=>x+y,0);
  document.querySelectorAll('.bar').forEach(x=>x.classList.toggle('on',x==g));
  $('lti').innerHTML=`<b>${k.slice(8)}/${k.slice(5,7)}/${k.slice(0,4)}</b> · Total ${fmt(t)}`+['Jasa','Barang','PPOB','Tip'].filter(q=>v[q]).map(q=>` · <i class="dot s-${q}"></i>${q} ${fmt(v[q])}`).join('');
};
document.addEventListener('mouseover',showBar);
document.addEventListener('click',showBar);
let curS='';
function printStruk(t){
  if(/Android/i.test(navigator.userAgent)){
    const ascii=String(t).replace(/[^\x20-\x7E\n]/g,'?');
    const bytes=[0x1B,0x40];
    for(const c of ascii)bytes.push(c.charCodeAt(0));
    bytes.push(10,10,10,10);
    let bin='';bytes.forEach(x=>{bin+=String.fromCharCode(x);});
    location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
  }else{
    $('pp').textContent=t;window.print();
  }
}
const isMobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
async function copyTxt(x){
  try{await navigator.clipboard.writeText(x);return true;}
  catch(e){
    try{const a=document.createElement('textarea');a.value=x;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok;}
    catch(e2){return false;}
  }
}
async function shareStruk(t){
  const x='```\n'+t+'\n```';
  if(isMobile&&navigator.share){navigator.share({text:x}).catch(()=>{});return;}
  const ok=await copyTxt(x);
  toast(ok?'Struk disalin. Tempel (Ctrl+V) di chat WhatsApp.':'Gagal menyalin struk.',ok?['Buka WhatsApp Web',()=>window.open('https://web.whatsapp.com/','_blank')]:undefined);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='pin'){PIN=$('pin').value.trim();loadAll();}});
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('mb')){if(!$('pin'))closeM();return;}
  const b=e.target.closest('[data-a]');
  if(!b||b.tagName=='INPUT'||b.tagName=='SELECT')return;
  const a=b.dataset.a,id=+b.dataset.id,l=cart.find(x=>x.id==id);
  switch(a){
    case'lp':LP=b.dataset.v;$('lf').value='';$('lt').value='';document.querySelectorAll('.lp [data-a="lp"]').forEach(x=>x.classList.toggle('on',x==b));renderLap();break;
    case'lrefresh':loadLap();break;
    case'login':PIN=$('pin').value.trim();loadAll();break;
    case'view':setView(b.dataset.v);break;
    case'mode':TH.mode=TH.mode=='dark'?'light':'dark';applyTheme();break;
    case'eye':SU=!SU;if(view=='laporan')renderLap();$('ey').textContent=SU?'👁':'🙈';render();break;
    case'cmin':b.closest('.cart').classList.toggle('min');break;
    case'pal':TH.pal=b.dataset.v;applyTheme();break;
    case'nota':{
      const n=hist.find(x=>x.id==id);if(!n)break;
      curS=strukOf(n,true);M(`<h3>Nota ${n.sid||'#'+n.id}${n.st=='Void'?' · VOID':''}</h3><div class="s">${hm(n.at)} · ${n.m}${n.tip?' · tip '+num(n.tip):''}</div><pre>${esc(curS)}</pre>`+(n.st=='Void'?`<div class="s">Alasan: ${esc(n.why)}${n.note?' — '+esc(n.note):''}</div><div class="btns"><button class="pri" data-a="close">Tutup</button></div>`:`<div class="btns"><button class="pri" data-a="print">Cetak ulang</button><button data-a="share">Share</button><button data-a="voidf" data-id="${n.id}">Void</button><button class="pri" data-a="close">Tutup</button></div>`));
      break;
    }
    case'copyn':{const n=hist.find(x=>x.id==id);try{navigator.clipboard.writeText(strukOf(n,true));toast('Teks struk disalin.');}catch(x){toast('Salin tidak didukung di sini.');}break;}
    case'voidf':M(`<h3>Void nota ${(hist.find(x=>x.id==id)||{}).sid||'#'+id}</h3><label>Alasan</label><select id="vr"><option>Salah Input</option><option>Salah Harga</option><option>Pelanggan Batal</option><option>Lainnya</option></select><label>Catatan</label><input id="vn"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="vp" type="checkbox" style="width:auto" checked>Buat nota pengganti</label><div class="btns"><button data-a="close">Batal</button><button class="pri" data-a="dovoid" data-id="${id}">Void nota</button></div>`);break;
    case'dovoid':{
      const n=hist.find(x=>x.id==id);if(!n)break;
      const why=$('vr').value,note=$('vn').value.trim(),rp=$('vp').checked;
      b.disabled=true;
      api('void',{id:n.sid,why,note}).then(()=>{
        closeM();n.st='Void';
        if(rp){cart=restoreCart(n);active={};fix=n.sid;setView('kasir');toast(`Nota ${n.sid} di-void. Perbaiki keranjang, lalu simpan sebagai nota pengganti.`);}
        else{renderHist();toast(`Nota ${n.sid} di-void dan keluar dari laporan.`);}
        loadHist();
      }).catch(e=>{b.disabled=false;toast('Gagal void: '+e.message);});
      break;
    }
    case'tab':tab=b.dataset.v;$('q').value='';render();break;
    case'svc':addSvc(b.dataset.k,false);break;
    case'svcnew':addSvc(b.dataset.k,true);break;
    case'item':addItem(b.dataset.i);break;
    case'ppobf':openPpob(+b.dataset.i);break;
    case'inc':if(l){l.q++;if(l.t=='svc'&&SVC[l.k][1]=='tier')active[l.k]=l.id;render();}break;
    case'dec':if(l){if(l.q>1)l.q--;else cart=cart.filter(x=>x!==l);render();}break;
    case'del':{const keep=JSON.parse(JSON.stringify(cart));cart=cart.filter(x=>x.id!=id);render();toast('Baris dihapus.',['Urungkan',()=>{cart=keep;render();}]);break;}
    case'clear':
      if(!cart.length)break;
      if(armed){const keep=JSON.parse(JSON.stringify(cart));cart=[];active={};fix=null;armed=false;b.textContent='Kosongkan';render();toast('Keranjang dikosongkan.',['Urungkan',()=>{cart=keep;render();}]);}
      else{armed=true;b.textContent='Yakin?';setTimeout(()=>{armed=false;b.textContent='Kosongkan';},3000);}
      break;
    case'struk':
      if(!cart.length){toast('Keranjang masih kosong.');break;}
      curS=struk();
      M(`<h3>Struk</h3><pre>${esc(curS)}</pre><div class="btns"><button class="pri" data-a="print">Cetak</button><button data-a="share">Share</button><button data-a="close">Tutup</button></div>`);
      break;
    case'print':printStruk(curS);break;
    case'share':shareStruk(curS);break;
    case'pay':openPay();break;
    case'close':closeM();break;
    case'pm':pay.m=b.dataset.v;pay.tip=0;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x==b));updatePay();break;
    case'qk':pay.recv=b.dataset.v=='pas'?pay.total:+b.dataset.v;pay.tip=0;$('recv').value=pay.recv;updatePay();break;
    case'notip':pay.tip=Math.max(0,pay.recv-pay.total);updatePay();break;
    case'save':save();break;
    case'ppadd':{
      const asli=+$('pa').value||0;
      if(!asli){toast('Isi harga asli dulu.');break;}
      const i=+b.dataset.i;
      cart.push({id:++uid,t:'ppob',ty:PPOBID[i],n:$('pd').value.trim()||PPOB[i][0],asli,admin:+$('pm2').value||0,m:+$('pmod').value||0,pf:$('ppf').value,cat:$('pc').value.trim()});
      closeM();render();break;
    }
  }
});
document.addEventListener('change',e=>{
  const a=e.target.dataset.a;if(!a)return;
  const l=cart.find(x=>x.id==+e.target.dataset.id);if(!l)return;
  if(a=='q'){l.q=Math.max(1,parseInt(e.target.value)||1);if(l.t=='svc'&&SVC[l.k][1]=='tier')active[l.k]=l.id;render();}
  else if(a=='kr'){l.kr=e.target.value;render();}
  else if(a=='lb'){l.lb=e.target.value;render();}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id=='q')render();
  else if(id=='hs'){hq=e.target.value;renderHist();}
  else if(id=='recv'){pay.recv=+e.target.value||0;pay.tip=0;updatePay();}
  else if(id=='pa'||id=='pm2'||id=='pmod')updatePpob(e);
});
applyTheme();boot();
</script>
